<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta id="app-viewport" name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#023047" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#023047" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TwoGether" />
    <meta name="application-name" content="TwoGether" />
    <meta
      name="description"
      content="TwoGether — two people commit to habits together. Unbreakable accountability."
    />
    <title>TwoGether</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('twogether_theme') || localStorage.getItem('duohabit_theme') || 'dark';
          document.documentElement.setAttribute('data-theme', saved);

          // Strictly enforce landscape mode across the project
          document.documentElement.classList.add('landscape-mode');
          if (window.screen && window.screen.orientation && window.screen.orientation.lock) {
            window.screen.orientation.lock('landscape').catch(function () {});
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
